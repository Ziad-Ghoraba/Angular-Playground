<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <h2>Login</h2>

  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input id="email" type="email" [formControl]="form.controls.email"/>
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password"/> <!-- This is the same as [formControl]="form.controls.password" but I need to connect it to the form in the component using [formGroup] -->
    </div>

    <button class="button">Login</button>
  </div>

  @if(emailIsInvalid)
  {
    <p class="control-error">Please enter a valid email address.</p>
  }
  @if(passwordIsInvalid)
  {
    <p class="control-error">Please enter a password with at least 6 characters and a question mark.</p>
  }
</form>
